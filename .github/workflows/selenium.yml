name: Selenium Python CI

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Google Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Allure CLI
        run: |
          wget https://github.com/allure-framework/allure2/releases/download/2.34.1/allure-2.34.1.tgz
          tar -xzf allure-2.34.1.tgz
          sudo mv allure-2.34.1 /opt/allure
          echo "/opt/allure/bin" >> $GITHUB_PATH

      - name: Verify Allure Installation
        run: |
          allure --version

      - name: Run Selenium Tests
        env:
          LOGIN_USER_1_EMAIL: ${{ secrets.LOGIN_USER_1_EMAIL }}
          LOGIN_USER_1_PASSWORD: ${{ secrets.LOGIN_USER_1_PASSWORD }}
          INVALID_PASSWORD: ${{ secrets.INVALID_PASSWORD }}
        run: |
          pytest Tests/test_login.py -v --alluredir=Reports

      - name: Generate Allure Report
        if: always()
        run: |
          allure generate Reports --clean -o allure-report

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Logs
          path: logs/
          if-no-files-found: ignore

      - name: Upload Allure Report
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

  deploy:
    needs: test
    if: always()
    runs-on: ubuntu-latest

    environment:
      name: github-pages

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4